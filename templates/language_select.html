<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocumentDB Viewer - Language Selection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00684A;
            --secondary-color: #116149;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .language-container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        
        .logo {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 40px;
        }
        
        .language-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            padding: 20px 30px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: white;
            color: #333;
            font-size: 1.2rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .language-btn:hover {
            border-color: var(--primary-color);
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 104, 74, 0.3);
        }
        
        .language-btn .flag {
            font-size: 2rem;
        }
        
        .language-btn .lang-name {
            flex: 1;
            text-align: left;
        }
        
        .language-btn .lang-native {
            color: #888;
            font-size: 0.9rem;
        }
        
        .language-btn:hover .lang-native {
            color: rgba(255,255,255,0.8);
        }
        
        .language-btn i {
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .language-btn:hover i {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="language-container">
        <div class="logo">
            <i class="bi bi-database"></i>
        </div>
        <h1>DocumentDB Viewer</h1>
        <p class="subtitle">Choose your language / Choisissez votre langue / Wählen Sie Ihre Sprache</p>
        
        <a href="{{ url_for('set_language', lang='en') }}" class="language-btn">
            <span class="flag">🇬🇧</span>
            <span class="lang-name">
                English
                <br>
                <span class="lang-native">English</span>
            </span>
            <i class="bi bi-arrow-right"></i>
        </a>
        
        <a href="{{ url_for('set_language', lang='fr') }}" class="language-btn">
            <span class="flag">🇫🇷</span>
            <span class="lang-name">
                French
                <br>
                <span class="lang-native">Français</span>
            </span>
            <i class="bi bi-arrow-right"></i>
        </a>
        
        <a href="{{ url_for('set_language', lang='de') }}" class="language-btn">
            <span class="flag">🇩🇪</span>
            <span class="lang-name">
                German
                <br>
                <span class="lang-native">Deutsch</span>
            </span>
            <i class="bi bi-arrow-right"></i>
        </a>
    </div>
</body>
</html>
